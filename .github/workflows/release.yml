name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs build, sign and notarize but only upload a workflow artifact.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # macOS 26 SDK is required (TransferPortal uses macOS 26 APIs); arm64 matches the build target.
    runs-on: macos-26
    timeout-minutes: 90
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          # bundle-app.sh derives CFBundleVersion from the commit count.
          fetch-depth: 0

      - name: Check required secrets
        run: |
          missing=()
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Read version
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Install Rust toolchain
        # Reads rust-toolchain.toml (channel, components, targets).
        run: rustup toolchain install && cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Import signing certificate
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -t cert -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          [[ -n "$identity" ]] || { echo "::error::No Developer ID Application identity in certificate"; exit 1; }
          echo "OSM_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build and sign app
        run: make release

      - name: Notarize app
        run: scripts/notarize.sh "build/app/同桌 · TwinDesk.app"

      - name: Build DMG
        run: |
          python3 -m venv build/dmg-tools
          build/dmg-tools/bin/pip install --quiet ds-store==1.3.3 mac-alias==2.2.3
          scripts/package-dmg.sh "build/app/同桌 · TwinDesk.app" \
            "build/dist/TwinDesk-${{ steps.version.outputs.version }}-arm64-installer.dmg"

      - name: Notarize DMG
        run: |
          dmg="build/dist/TwinDesk-${{ steps.version.outputs.version }}-arm64-installer.dmg"
          scripts/notarize.sh "$dmg"
          # Stapling rewrites the image, so the checksum must follow it.
          (cd build/dist && shasum -a 256 "$(basename "$dmg")" > "$(basename "$dmg").sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TwinDesk-${{ steps.version.outputs.version }}
          path: build/dist/TwinDesk-*-installer.dmg*

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/dist/TwinDesk-*-installer.dmg* \
            --verify-tag --title "同桌 · TwinDesk $GITHUB_REF_NAME" --generate-notes

      - name: Remove signing keychain
        if: always()
        run: |
          [[ -z "${SIGNING_KEYCHAIN:-}" ]] || security delete-keychain "$SIGNING_KEYCHAIN"
