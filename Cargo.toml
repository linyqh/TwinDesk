[workspace]
resolver = "3"
members = [
    "crates/model",
    "crates/core",
    "crates/protocol",
    "crates/transport",
    "crates/transfer",
    "crates/platform-macos",
    "crates/ffi",
    "tools/uniffi-bindgen-swift",
]
default-members = [
    "crates/model",
    "crates/core",
    "crates/protocol",
    "crates/transport",
    "crates/transfer",
    "crates/platform-macos",
    "crates/ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
osm-model = { path = "crates/model" }
osm-core = { path = "crates/core" }
osm-protocol = { path = "crates/protocol" }
osm-transport = { path = "crates/transport" }
osm-transfer = { path = "crates/transfer" }
osm-platform-macos = { path = "crates/platform-macos" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
bytes = "1.12.1"
prost = "0.14.4"
prost-build = "0.14.4"
protox = "0.10.0"
uniffi = "0.32.2"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = "line-tables-only"
